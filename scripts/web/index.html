<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#171510">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AlgoLand">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="icon" href="icones/icone-192.png">
<title>Jogar AlgoLand</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;height:100dvh;background:#000;color:#f8ecd3;font:16px system-ui;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* O jogo ocupa a área segura: nada fica sob o entalhe, a ilha dinâmica ou a barra inferior do iPhone */
#palco{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:#000}
canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
.painel{position:fixed;inset:0;display:grid;place-content:center;gap:16px;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));text-align:center;background:#211b15;z-index:2}
.painel[hidden]{display:none}
h1{font-size:24px;margin:0}
p{margin:0;max-width:480px;line-height:1.5;overflow-wrap:anywhere}
.suave{color:#c9b898;font-size:14px}
progress{width:min(100%,360px);height:20px;margin:auto;accent-color:#dfab5b}
button,a.botao{font:inherit;color:#ffcf86;padding:14px 26px;border:1px solid #dfab5b;border-radius:8px;background:#382719;cursor:pointer;text-decoration:none;min-height:48px}
button.grande{font-size:20px;background:#5a3b1f;color:#fff0cf}
button.discreto{border-color:#6c5a45;color:#c9b898;background:transparent}
[hidden]{display:none!important}
.dica{background:#2b2218;border:1px solid #6c5a45;border-radius:10px;padding:14px 16px;max-width:420px}
.dica b{color:#ffcf86}
.passos{display:grid;gap:6px;text-align:left;margin:6px auto 0}
#girar{position:fixed;inset:0;display:none;place-content:center;gap:12px;text-align:center;background:#171510ee;z-index:3;padding:24px}
@media (orientation:portrait) and (max-height:900px){#girar.ativo{display:grid}}
</style>
</head>
<body>
<div id="palco"><canvas id="canvas" tabindex="0" aria-label="AlgoLand"></canvas></div>
<div id="estado" class="painel" role="status" aria-live="polite">
  <h1>Preparando sua aventura</h1>
  <p id="mensagem">Carregando o jogo…</p>
  <progress id="progresso" max="100" value="0"></progress>
  <div id="instalar" class="dica" hidden></div>
  <p id="erro" hidden></p>
  <button id="tentar" hidden>Tentar novamente</button>
</div>
<div id="toque" class="painel" hidden>
  <h1>Tudo pronto!</h1>
  <p class="suave">Os controles aparecem na tela. Gire o aparelho para jogar deitado, com mais espaço.</p>
  <button id="jogar" class="grande" type="button">TOCAR PARA JOGAR</button>
</div>
<div id="girar" class="ativo" hidden aria-hidden="true"><h1>↻</h1><p>Gire o aparelho para jogar deitado.</p><button id="continuar-em-pe" class="discreto" type="button">Jogar em pé mesmo assim</button></div>
<script src="index.js"></script><script src="carregar.js"></script>
</body></html>
