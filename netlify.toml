# Netlify: instala, gera dist/ e publica. As rotas usam # (#/plantas), então não precisa de redirecionamento.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Sprites e arquivos com hash no nome mudam pouco: cache longo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/sprites/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
