# Netlify: instala, gera dist/ e publica. As rotas usam # (#/plantas), então não precisa de redirecionamento.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Sprites e arquivos com hash no nome mudam pouco: cache longo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/sprites/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Service worker e manifesto do app: sempre a versão mais nova
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Partes do pacote do jogo têm hash no nome; o wasm e o loader mudam com a versão
[[headers]]
  for = "/jogar/dados-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/jogar/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/wasm"

# Atualizações de conteúdo dos aplicativos: manifesto fresco; pacotes têm hash no nome
[[headers]]
  for = "/jogar/atualizacao/versao.json"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/jogar/atualizacao/*.pck"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
