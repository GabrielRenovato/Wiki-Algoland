# Netlify: instala, gera dist/ e publica. As rotas usam # (#/plantas), então não precisa de redirecionamento.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Sprites e arquivos com hash no nome mudam pouco: cache longo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/sprites/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Partes do pacote do jogo têm hash no nome; o wasm e o loader mudam com a versão
[[headers]]
  for = "/jogar/dados-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/jogar/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/wasm"

# Atualização de conteúdo do app Android: o versao.json sempre fresco; os patches têm versão no nome
[[headers]]
  for = "/jogar/atualizacao/versao.json"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/jogar/atualizacao/patch-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
